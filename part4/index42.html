<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <button id="b1">Click</button>
    <button id="b2">Mouse Enter</button>
    <button id="b3">Mouse Leave</button>
    <script>
      $("#b1").click(() => {
        alert("Button Clicked");
      });
      $("#b2").mouseenter(() => {
        alert("Mouse Enter!");
      });
      $("#b3").mouseleave(() => {
        alert("Mouse Leave!");
      });
    </script>
  </body>
</html>
