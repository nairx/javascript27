<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h1>My Hobbies</h1>
    <p>
      <input type="text" placeholder="Enter your Hobby" id="hobby" /><button
        id="btn"
      >
        Add
      </button>
    </p>
    <ol id="list"></ol>
    <button id="deleteBtn">Delete All</button>
    <script>
      $("#btn").click(() => {
        let txt = $("#hobby").val();
        $("#list").append(`<li>${txt}<button>Delete</button></li>`);
      });
      $("#deleteBtn").click(() => {
        $("#list").empty();
      });
    </script>
  </body>
</html>
